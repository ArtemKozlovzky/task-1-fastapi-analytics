services:
  db:
    image: postgres:17
    container_name: db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DOCKER_TARGET_USER}
      POSTGRES_PASSWORD: ${DOCKER_TARGET_PASSWORD}
      POSTGRES_DB: ${DOCKER_TARGET_DBNAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_TARGET_USER} -d ${DOCKER_TARGET_DBNAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: python app/docker-script.py
    volumes:
      - .:/app
    restart: "no"

  app:
    build: .
    container_name: app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
